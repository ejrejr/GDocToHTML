<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #202124;
      margin: 0;
      padding: 12px;
      background: #fff;
    }
    h2 {
      font-size: 13px;
      font-weight: 700;
      color: #3c4043;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #dadce0;
      background: #f8f9fa;
      color: #202124;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #eef1f5; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: #1557b0; }
    .status {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
      line-height: 1.4;
    }
    .status.ok   { display: block; background: #e6f4ea; color: #137333; }
    .status.warn { display: block; background: #fef7e0; color: #b06000; }
    .status.err  { display: block; background: #fce8e6; color: #c5221f; }
    .warnings {
      background: #fef7e0;
      border-left: 3px solid #f9ab00;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      display: none;
      line-height: 1.4;
    }
    .warnings ul { margin: 4px 0 0; padding-left: 16px; }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 11px;
      color: #5f6368;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .view-toggle {
      display: inline-flex;
      border: 1px solid #dadce0;
      border-radius: 5px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-toggle button {
      flex: none;
      border: none;
      border-radius: 0;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      background: #fff;
      color: #5f6368;
    }
    .view-toggle button.active {
      background: #e8f0fe;
      color: #1967d2;
    }
    .preview-pane {
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 10px;
      max-height: 360px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.5;
      background: #fafafa;
    }
    #preview h1 { font-size: 17px; margin: 6px 0; }
    #preview h2 { font-size: 15px; margin: 6px 0; text-transform: none; letter-spacing: normal; color: #202124; }
    #preview h3 { font-size: 13px; margin: 6px 0; }
    #preview h4, #preview h5, #preview h6 { font-size: 12px; margin: 6px 0; }
    #preview p { margin: 6px 0; }
    #preview blockquote {
      border-left: 3px solid #5f6368;
      margin: 8px 0;
      padding-left: 10px;
      color: #3c4043;
    }
    #preview pre {
      background: #f1f3f4;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }
    #preview code {
      background: #f1f3f4;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }
    #preview pre code {
      background: transparent;
      padding: 0;
    }
    #preview hr {
      border: none;
      border-top: 1px solid #dadce0;
      margin: 10px 0;
    }
    #sourcePreview {
      display: none;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #202124;
    }
  </style>
</head>
<body>
  <h2>1. Extract from Google Docs</h2>
  <div class="btn-row">
    <button id="btnSel" onclick="runExtract('selection')">Extract Selection</button>
    <button id="btnDoc" onclick="runExtract('document')">Extract Active Tab</button>
  </div>

  <h2>2. Export Clean HTML</h2>
  <div class="btn-row">
    <button id="btnCopyHtml" class="primary" disabled onclick="copyCleanHtml()">Copy Clean HTML (Medium)</button>
  </div>
  <div class="btn-row">
    <button id="btnCopyRaw" disabled onclick="copyRawHtml()">Copy Raw HTML</button>
    <button id="btnDlHtml" disabled onclick="downloadHtml()">Download .html</button>
  </div>

  <div id="status" class="status"></div>
  <div id="warnings" class="warnings"></div>

  <div class="preview-header">
    <div id="meta" class="meta">Click an Extract button above to preview clean HTML.</div>
    <div class="view-toggle" role="tablist" aria-label="Preview mode">
      <button id="tabRendered" class="active" onclick="setPreviewMode('rendered')">Rendered</button>
      <button id="tabSource" onclick="setPreviewMode('source')">HTML</button>
    </div>
  </div>

  <div id="preview" class="preview-pane"></div>
  <pre id="sourcePreview" class="preview-pane"></pre>

  <script>
    let lastExport = null;

    function runExtract(scope) {
      setStatus('Extracting clean HTML structure...', 'warn');
      toggleActionButtons(false);
      google.script.run
        .withSuccessHandler(onExtractSuccess)
        .withFailureHandler(function (err) {
          setStatus('Error: ' + (err && err.message ? err.message : String(err)), 'err');
        })
        .extractContent(scope);
    }

    function onExtractSuccess(res) {
      if (!res || res.error) {
        setStatus((res && res.error) || 'Extraction failed.', 'err');
        return;
      }

      lastExport = res;
      document.getElementById('preview').innerHTML = res.html;
      document.getElementById('sourcePreview').textContent = res.html;
      document.getElementById('meta').textContent =
        (res.scope === 'selection' ? 'Selection' : 'Tab: ' + res.tabTitle) +
        ' \u2022 ' + res.wordCount + ' words';

      const warnBox = document.getElementById('warnings');
      if (res.warnings && res.warnings.length > 0) {
        warnBox.innerHTML =
          '<strong>Medium Compatibility Notes</strong><ul>' +
          res.warnings.map(function (w) { return '<li>' + escapeHtml(w) + '</li>'; }).join('') +
          '</ul>';
        warnBox.style.display = 'block';
      } else {
        warnBox.style.display = 'none';
      }

      toggleActionButtons(true);
      setStatus('Ready! Click "Copy Clean HTML (Medium)" below.', 'ok');
    }

    function setPreviewMode(mode) {
      const renderedEl = document.getElementById('preview');
      const sourceEl = document.getElementById('sourcePreview');
      const tabRendered = document.getElementById('tabRendered');
      const tabSource = document.getElementById('tabSource');

      if (mode === 'source') {
        renderedEl.style.display = 'none';
        sourceEl.style.display = 'block';
        tabRendered.classList.remove('active');
        tabSource.classList.add('active');
      } else {
        renderedEl.style.display = 'block';
        sourceEl.style.display = 'none';
        tabRendered.classList.add('active');
        tabSource.classList.remove('active');
      }
    }

    async function copyCleanHtml() {
      if (!lastExport) return;
      const htmlForMedium = lastExport.mediumHtml || lastExport.html;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const item = new ClipboardItem({
            'text/html': new Blob([htmlForMedium], { type: 'text/html' }),
            'text/plain': new Blob([lastExport.plainText], { type: 'text/plain' }),
          });
          await navigator.clipboard.write([item]);
          setStatus('Copied clean HTML \u2014 paste directly into Medium (Ctrl+V).', 'ok');
          return;
        }
      } catch (e) {
        // Expected if sandboxed iframe blocks async clipboard-write; fall through to copy event.
      }

      const ok = copyViaCopyEvent(htmlForMedium, lastExport.plainText);
      if (ok) {
        setStatus('Copied clean HTML \u2014 paste directly into Medium (Ctrl+V).', 'ok');
      } else {
        setStatus('Browser blocked clipboard write. Click inside the Rendered preview and press Ctrl+A, Ctrl+C.', 'warn');
      }
    }

    async function copyRawHtml() {
      if (!lastExport) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(lastExport.html);
          setStatus('Copied raw HTML markup to clipboard.', 'ok');
          return;
        }
      } catch (e) {
        // Fall through to synchronous copy event fallback.
      }

      const ok = copyViaCopyEvent(null, lastExport.html);
      setStatus(
        ok ? 'Copied raw HTML markup to clipboard.' : 'Clipboard blocked \u2014 use Download .html instead.',
        ok ? 'ok' : 'warn'
      );
    }

    function downloadHtml() {
      if (!lastExport) return;
      const filename = lastExport.suggestedFilename || 'article.html';
      const blob = new Blob([lastExport.html + '\n'], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('Downloaded ' + filename, 'ok');
    }

    function copyViaCopyEvent(html, plainText) {
      const handler = function (e) {
        e.preventDefault();
        if (html) e.clipboardData.setData('text/html', html);
        e.clipboardData.setData('text/plain', plainText);
      };

      // Use a temporary visible-to-selection node so copy works regardless of preview mode.
      const scratch = document.createElement('span');
      scratch.textContent = 'copy';
      scratch.style.position = 'fixed';
      scratch.style.left = '-9999px';
      scratch.style.top = '0';
      document.body.appendChild(scratch);

      document.addEventListener('copy', handler);
      let ok = false;
      try {
        const range = document.createRange();
        range.selectNodeContents(scratch);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        ok = document.execCommand('copy');
        sel.removeAllRanges();
      } finally {
        document.removeEventListener('copy', handler);
        document.body.removeChild(scratch);
      }
      return ok;
    }

    function toggleActionButtons(enabled) {
      document.getElementById('btnCopyHtml').disabled = !enabled;
      document.getElementById('btnCopyRaw').disabled = !enabled;
      document.getElementById('btnDlHtml').disabled = !enabled;
    }

    function setStatus(msg, level) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + level;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
